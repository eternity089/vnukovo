server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip off;
    sendfile on;

    location /assets/ {
        try_files $uri =404;

        # 🔥 КРИТИЧЕСКИЙ ФИКС
        keepalive_timeout 0;
        proxy_buffering off;

        add_header Connection "close";
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;

        add_header Connection "close";
    }
}