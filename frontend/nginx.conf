server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    gzip off;

    location /assets/ {
        try_files $uri =404;
        access_log off;

        # важно: убираем любые кеш/вариации
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Accept-Ranges bytes;
    }

    location / {
        try_files $uri /index.html;
    }
}