server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ❌ отключаем gzip (очень важно)
    gzip off;

    location /assets/ {
        try_files $uri =404;
        access_log off;

        # ❌ отключаем кеширование (для проверки)
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri /index.html;
    }
}